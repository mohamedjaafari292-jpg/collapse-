<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jaâfari - Terminal</title>
    <style>
        /* إعدادات الشاشة الأساسية وخلفية الماتريكس */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* قماش خلفية الماتريكس */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.15; /* شفافية المطر حتى لا يغطي على النص */
        }

        /* واجهة الـ Terminal العلوية */
        .terminal-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.75); /* خلفية سوداء شبه شفافة */
        }

        /* تأثير العيون والاسم */
        .header-eyes {
            text-align: center;
            color: #ff0000;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 5px;
        }

        .header-name {
            text-align: center;
            color: #00bcff;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00bcff;
            margin-bottom: 20px;
        }

        /* نصوص الشفرات */
        .line {
            color: #00ff00;
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.4;
            text-shadow: 0 0 3px #00ff00;
        }

        .warn { color: #ff3333; text-shadow: 0 0 3px #ff3333; }
        .info { color: #00bcff; text-shadow: 0 0 3px #00bcff; }
        .accent { color: #ffff00; text-shadow: 0 0 3px #ffff00; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="terminal-container" id="terminal">
        <div class="header-eyes">👁️   👁️</div>
        <div class="header-name">jaâfari</div>
        <div class="line warn">[CRITICAL] Firewall integrity compromised.</div>
        <div class="line">[OK] Anti-forensics: log shredder armed.</div>
        </div>

    <script>
        // === أولاً: كود تأثير مطر الـ Matrix ===
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; // اللون الأخضر للماتريكس
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // === ثانياً: كود محاكاة تحميل تطبيقات Google Play والأنشطة ===
        const terminal = document.getElementById('terminal');
        
        const logs = [
            { text: "[NET] Connecting to Google Play API production servers...", type: "info" },
            { text: "[OK] Secure handshake established with com.android.vending", type: "line" },
            { text: "[FETCH] Intercepting background download requests...", type: "line" },
            { text: "------------------------------------------------------", type: "line" },
            { isProgress: true, app: "WhatsApp Messenger", pkg: "com.whatsapp" },
            { text: "[SUCCESS] Package com.whatsapp injected into memory workspace.", type: "line" },
            { isProgress: true, app: "Facebook Lite", pkg: "com.facebook.lite" },
            { text: "[WARN] Decompiling classes.dex for com.facebook.lite...", type: "warn" },
            { text: "[SUCCESS] Native libraries hooked successfully.", type: "line" },
            { isProgress: true, app: "Instagram", pkg: "com.instagram.android" },
            { text: "[INFO] Session tokens extracted from volatile storage.", type: "info" },
            { text: "[SYSTEM] All Google Play targets synchronized. Awaiting next deployment...", type: "accent" }
        ];

        let logIndex = 0;

        function printNextLog() {
            if (logIndex >= logs.length) return;

            const currentLog = logs[logIndex];
            
            if (currentLog.isProgress) {
                // إنشاء سطر تحميل متحرك للتطبيق
                const progressLine = document.createElement('div');
                progressLine.className = 'line info';
                terminal.appendChild(progressLine);
                
                let percent = 0;
                const interval = setInterval(() => {
                    percent += Math.floor(Math.random() * 15) + 5;
                    if (percent > 100) percent = 100;
                    
                    progressLine.innerHTML = `[DOWN] Google Play :: Downloading ${currentLog.app} [${currentLog.pkg}] ... ${percent}%`;
                    terminal.scrollTop = terminal.scrollHeight;

                    if (percent === 100) {
                        clearInterval(interval);
                        logIndex++;
                        setTimeout(printNextLog, 600);
                    }
                }, 150);
            } else {
                // طباعة سطر عادي
                const line = document.createElement('div');
                line.className = `line ${currentLog.type}`;
                line.innerText = currentLog.text;
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                
                logIndex++;
                setTimeout(printNextLog, Math.random() * 800 + 400); // وقت عشوائي بين الأسطر لتبدو حقيقية
            }
        }

        // بدء التدفق بعد ثانيتين من فتح الموقع
        setTimeout(printNextLog, 2000);

        // إعادة ضبط أبعاد الكانفاس عند تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
