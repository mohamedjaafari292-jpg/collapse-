<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BREACH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@700;900&display=swap');

:root {
  --neon-blue:   #00b4ff;
  --neon-blue2:  #0066ff;
  --blood-red:   #ff0022;
  --acid-green:  #00ff41;
  --dim-green:   #003b0f;
  --matrix-char: #00ff41;
  --bg:          #000000;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  color: var(--acid-green);
}

/* ═══════════════════════════════════════
   MATRIX RAIN CANVAS (background layer)
═══════════════════════════════════════ */
#matrixCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.18;
}

/* ═══════════════════════════════════════
   CRT OVERLAY
═══════════════════════════════════════ */
#crt {
  position: fixed;
  inset: 0;
  z-index: 200;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.13) 2px,
      rgba(0,0,0,0.13) 4px
    );
  animation: crtFlicker 8s infinite;
}
@keyframes crtFlicker {
  0%,91%,93%,95%,100% { opacity:1; }
  92%  { opacity:.82; }
  94%  { opacity:.9;  }
}

#vignette {
  position: fixed;
  inset: 0;
  z-index: 199;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%);
}

/* ═══════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════ */
#app {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 860px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 16px 14px;
}

/* ── TOP BAR ── */
#topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: .6rem;
  color: #005522;
  margin-bottom: 10px;
  letter-spacing: .12em;
}
#topbar span { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

/* ═══════════════════════════════════════
   EYES  — canvas-drawn
═══════════════════════════════════════ */
#eyesCanvas {
  display: block;
  margin: 0 auto 6px;
  /* glow */
  filter: drop-shadow(0 0 8px #ff0022) drop-shadow(0 0 22px #880011);
}

/* ═══════════════════════════════════════
   NAME
═══════════════════════════════════════ */
#name {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--neon-blue);
  letter-spacing: .3em;
  text-shadow: 0 0 8px var(--neon-blue), 0 0 24px var(--neon-blue2);
  margin-bottom: 6px;
  animation: nameGlow 3s ease-in-out infinite;
}
@keyframes nameGlow {
  0%,100% { text-shadow: 0 0 8px #00b4ff, 0 0 24px #0044cc; }
  50%      { text-shadow: 0 0 18px #44ddff, 0 0 50px #0077ff; }
}

/* ═══════════════════════════════════════
   DANGER
═══════════════════════════════════════ */
#danger {
  font-family: 'Orbitron', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  color: var(--blood-red);
  letter-spacing: .4em;
  text-shadow: 0 0 12px #ff0022, 0 0 35px #aa0011, 0 0 70px #550000;
  animation: dangerBlink 1.1s step-end infinite, dangerGlitch 4s infinite;
  margin-bottom: 10px;
}
@keyframes dangerBlink {
  0%,49%{ opacity:1 } 50%,100%{ opacity:.15 }
}
@keyframes dangerGlitch {
  0%,88%,100% { transform:translate(0) skew(0deg); }
  89% { transform:translate(-4px,1px) skew(-1deg); text-shadow:-4px 0 #ff0022, 4px 0 #00ffff; }
  90% { transform:translate(4px,-1px) skew(1deg);  text-shadow:4px 0 #ff0022,-4px 0 #ff00aa; }
  91% { transform:translate(0); }
  93% { transform:translate(3px,2px); }
  94% { transform:translate(0); }
}

/* ═══════════════════════════════════════
   DIVIDER
═══════════════════════════════════════ */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, #00ff41 30%, #00b4ff 70%, transparent 100%);
  margin: 4px 0 8px;
  animation: divGlow 2s ease-in-out infinite;
}
@keyframes divGlow { 0%,100%{opacity:.35} 50%{opacity:1} }

/* ═══════════════════════════════════════
   TERMINAL PANEL
═══════════════════════════════════════ */
#terminal {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: 1px solid #00ff4133;
  background: rgba(0,8,0,0.88);
  box-shadow: 0 0 24px #00ff4115, inset 0 0 40px rgba(0,255,65,.03);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

#termHead {
  padding: 4px 12px;
  background: #000d00;
  border-bottom: 1px solid #00ff4122;
  display: flex;
  justify-content: space-between;
  font-size: .6rem;
  color: #005522;
  flex-shrink: 0;
}

#termBody {
  flex: 1;
  overflow: hidden;
  position: relative;
  padding: 6px 14px 6px;
}

#logWrap {
  position: absolute;
  bottom: 0;
  left: 14px; right: 14px;
}

.ll {
  font-size: .68rem;
  line-height: 1.6;
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: lineIn .08s ease;
}
@keyframes lineIn { from{opacity:0;transform:translateX(-5px)} to{opacity:1;transform:none} }

/* color classes */
.cg { color: var(--acid-green); }
.cy { color: #ffcc00; }
.cc { color: #00e5ff; }
.cr { color: #ff3344; }
.cw { color: #aaaaaa; }
.cd { color: #004010; }
.cb { color: var(--neon-blue); }
.cm { color: #cc00ff; }

/* cursor */
.cur {
  display:inline-block;
  width:7px; height:.8em;
  background:var(--acid-green);
  animation: cb .75s step-end infinite;
  vertical-align: text-bottom;
  margin-left:1px;
}
@keyframes cb { 0%,100%{opacity:1} 50%{opacity:0} }

/* typewriter critical warning */
#critWarn {
  font-family: 'VT323', monospace;
  font-size: .78rem;
  color: #ff3344;
  letter-spacing: .05em;
  min-height: 1.2em;
  flex-shrink: 0;
  padding: 3px 14px 0;
  text-shadow: 0 0 6px #ff0022;
}
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>
<div id="crt"></div>
<div id="vignette"></div>

<div id="app">
  <!-- top bar -->
  <div id="topbar">
    <span id="tbL">SESSION_ID: ████████████</span>
    <span id="tbC">NODE: TOR/██████</span>
    <span id="tbR" id="clock">--:--:--</span>
  </div>

  <!-- eyes -->
  <canvas id="eyesCanvas" width="340" height="120"></canvas>

  <!-- name -->
  <div id="name">ja&#226;fari</div>

  <!-- danger -->
  <div id="danger">&#9608; DANGER &#9608;</div>

  <div class="divider"></div>

  <!-- typewriter warning -->
  <div id="critWarn"></div>

  <!-- terminal -->
  <div id="terminal">
    <div id="termHead">
      <span>root@phantom:~# &#9608;ENCRYPTED&#9608; [THREADS: <span id="thrCount">0</span>]</span>
      <span id="termClock">--:--:--</span>
    </div>
    <div id="termBody">
      <div id="logWrap">
        <div class="ll cg" id="cursorLine">$ <span class="cur"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   MATRIX RAIN
═══════════════════════════════════════════ */
(function() {
  const c = document.getElementById('matrixCanvas');
  const ctx = c.getContext('2d');
  const CHARS = 'アァイィウェオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEF<>[]{}|\\/*%$#@!?';
  let cols, drops;

  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    cols  = Math.floor(c.width / 14);
    drops = Array(cols).fill(1).map(() => Math.random() * -c.height / 14 | 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.055)';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.font = '13px Share Tech Mono';
    for (let i = 0; i < cols; i++) {
      const ch = CHARS[Math.random() * CHARS.length | 0];
      const bright = Math.random() > 0.92;
      ctx.fillStyle = bright ? '#aaffcc' : '#00ff41';
      ctx.fillText(ch, i * 14, drops[i] * 14);
      if (drops[i] * 14 > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += Math.random() > 0.3 ? 1 : 0;
    }
  }
  setInterval(draw, 40);
})();

/* ═══════════════════════════════════════════
   EYES — canvas rendering
═══════════════════════════════════════════ */
(function() {
  const c  = document.getElementById('eyesCanvas');
  const cx = c.getContext('2d');
  let t = 0;

  function drawEye(ox, oy, blink, pupilX, pupilY) {
    const W = 130, H = 52;
    cx.save();
    cx.translate(ox, oy);

    /* ── outer glow ── */
    const outerGlow = cx.createRadialGradient(0,0,H*.3, 0,0,W*.65);
    outerGlow.addColorStop(0, 'rgba(200,0,0,0)');
    outerGlow.addColorStop(1, 'rgba(200,0,0,0.18)');
    cx.fillStyle = outerGlow;
    cx.beginPath(); cx.ellipse(0,0,W*.75,H*.9,0,0,Math.PI*2); cx.fill();

    /* ── sclera ── */
    const scl = cx.createRadialGradient(0,0,5, 0,0,W*.45);
    scl.addColorStop(0,   '#1a0000');
    scl.addColorStop(.7,  '#0d0000');
    scl.addColorStop(1,   '#000000');
    cx.save();
    cx.beginPath(); cx.ellipse(0,0,W*.5,H*.46,0,0,Math.PI*2); cx.fillStyle=scl; cx.fill();
    cx.strokeStyle='#550000'; cx.lineWidth=1.2; cx.stroke();
    cx.restore();

    /* ── veins ── */
    cx.save();
    cx.globalAlpha = .35;
    const veins = [[-W*.45,-H*.1,-W*.2,H*.05],[W*.45,-H*.12,W*.2,H*.04],
                   [-W*.4,H*.12,-W*.18,-H*.06],[W*.42,H*.1,W*.19,-H*.04],
                   [-W*.38,0,-W*.14,H*.09],[W*.4,0,W*.15,-H*.08]];
    veins.forEach(([x1,y1,x2,y2]) => {
      cx.beginPath(); cx.moveTo(x1,y1); cx.quadraticCurveTo((x1+x2)/2,(y1+y2)/2+rnd(-5,5),x2,y2);
      cx.strokeStyle='#cc000088'; cx.lineWidth=.7; cx.stroke();
    });
    cx.restore();

    /* ── iris ── */
    cx.save();
    cx.translate(pupilX, pupilY);
    const iris = cx.createRadialGradient(0,0,1, 0,0,H*.3);
    iris.addColorStop(0,   '#6b0000');
    iris.addColorStop(.5,  '#400000');
    iris.addColorStop(1,   '#1a0000');
    cx.beginPath(); cx.arc(0,0,H*.3,0,Math.PI*2); cx.fillStyle=iris; cx.fill();

    /* iris texture rings */
    for (let r=2;r<H*.28;r+=4) {
      cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2);
      cx.strokeStyle=`rgba(180,0,0,${.06+Math.sin(r)*.04})`; cx.lineWidth=.6; cx.stroke();
    }
    /* iris radial lines */
    for (let a=0;a<Math.PI*2;a+=Math.PI/12) {
      cx.beginPath();
      cx.moveTo(Math.cos(a)*H*.08, Math.sin(a)*H*.08);
      cx.lineTo(Math.cos(a)*H*.28, Math.sin(a)*H*.28);
      cx.strokeStyle='rgba(120,0,0,.25)'; cx.lineWidth=.4; cx.stroke();
    }

    /* ── slit pupil ── */
    const pupR = cx.createRadialGradient(0,0,0, 0,0,H*.11);
    pupR.addColorStop(0,  '#000'); pupR.addColorStop(1, '#0a0000');
    cx.beginPath(); cx.ellipse(0,0,H*.075,H*.22,0,0,Math.PI*2);
    cx.fillStyle=pupR; cx.fill();

    /* ── glint ── */
    cx.beginPath(); cx.ellipse(-H*.09,-H*.1,H*.045,H*.025,-Math.PI/5,0,Math.PI*2);
    cx.fillStyle='rgba(255,60,60,.35)'; cx.fill();
    cx.restore();

    /* ── outer ring glow ── */
    cx.save();
    cx.translate(pupilX,pupilY);
    cx.beginPath(); cx.arc(0,0,H*.31,0,Math.PI*2);
    cx.strokeStyle='rgba(255,0,30,.7)'; cx.lineWidth=1; cx.stroke();
    cx.beginPath(); cx.arc(0,0,H*.315,0,Math.PI*2);
    cx.strokeStyle='rgba(255,0,30,.25)'; cx.lineWidth=2.5; cx.stroke();
    cx.restore();

    /* ── eyelid mask (blink) ── */
    if (blink > 0) {
      cx.save();
      cx.fillStyle = '#000';
      cx.beginPath(); cx.ellipse(0,0,W*.5,H*.46,0,0,Math.PI*2);
      cx.scale(1, blink); cx.fill();
      cx.restore();
    }

    /* ── eyelid edge lines ── */
    cx.save();
    cx.strokeStyle='#330000'; cx.lineWidth=1.5;
    cx.beginPath();
    cx.moveTo(-W*.5,0);
    cx.bezierCurveTo(-W*.25,-H*.5, W*.25,-H*.5, W*.5,0);
    cx.stroke();
    cx.beginPath();
    cx.moveTo(-W*.5,0);
    cx.bezierCurveTo(-W*.25, H*.5, W*.25, H*.5, W*.5,0);
    cx.stroke();
    cx.restore();

    cx.restore();
  }

  let blinkTimer = 0, blinkState = 0;

  function rnd(a,b){return Math.random()*(b-a)+a;}

  function frame() {
    cx.clearRect(0,0,c.width,c.height);
    t += .016;

    /* blink logic */
    blinkTimer++;
    if (blinkTimer > 300 + rnd(0,200)|0) { blinkTimer=0; blinkState=1; }
    if (blinkState>0) { blinkState = Math.min(blinkState+.12,1); if(blinkState>=1){blinkState=-1;} }
    if (blinkState<0) { blinkState = Math.min(blinkState+.12,0); }
    const blink = blinkState > 0 ? blinkState : (blinkState < 0 ? 1+blinkState : 0);

    /* pupil wander */
    const px = Math.sin(t*.7)*14;
    const py = Math.sin(t*.4)*5;

    drawEye(90,  60, blink, px, py);
    drawEye(250, 60, blink, px, py);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ═══════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════ */
function tick() {
  const s = new Date().toTimeString().slice(0,8);
  document.getElementById('termClock').textContent = s;
  document.getElementById('tbR').textContent = s;
  const sid = '████' + Math.random().toString(36).slice(2,10).toUpperCase() + '████';
  document.getElementById('tbL').textContent = 'SESSION_ID: ' + sid;
}
setInterval(tick,1000); tick();

/* ═══════════════════════════════════════════
   THREAD COUNTER (fake)
═══════════════════════════════════════════ */
setInterval(()=>{
  document.getElementById('thrCount').textContent = (Math.random()*24+4|0);
},800);

/* ═══════════════════════════════════════════
   TYPEWRITER CRITICAL WARNINGS
═══════════════════════════════════════════ */
const warnings = [
  '⚠  CRITICAL: Firewall integrity compromised — layer 7 exposed',
  '⚠  WARNING: Kernel module injection detected in ring-0',
  '⚠  ALERT: Rootkit signature match — evasion active',
  '⚠  CRITICAL: Memory address 0x' + rndHex(8) + ' overwritten',
  '⚠  WARNING: Packet interception enabled on eth0',
  '⚠  ALERT: Anti-forensics engaged — log shredder running',
];
let wIdx = 0;
function typeWarning() {
  const el  = document.getElementById('critWarn');
  const txt = warnings[wIdx++ % warnings.length];
  el.textContent = '';
  let i = 0;
  const iv = setInterval(()=>{
    el.textContent += txt[i++];
    if(i>=txt.length){ clearInterval(iv); setTimeout(typeWarning, 3800); }
  }, 28);
}
setTimeout(typeWarning, 600);

/* ═══════════════════════════════════════════
   ASYNC LOG STREAMING  (multi-speed threads)
═══════════════════════════════════════════ */
function rnd(a,b){return (Math.random()*(b-a)+a)|0;}
function rndHex(n){return [...Array(n)].map(()=>(Math.random()*16|0).toString(16).toUpperCase()).join('');}
function rndBin(n){return [...Array(n)].map(()=>(Math.random()*2|0)).join('');}
function rndAddr(){return '0x'+rndHex(8);}

const LOG_POOL = [
  // PKG ops
  ()=>({c:'cy', t:`[PKG  T${rnd(1,8)}] Loading PKG: exploit-${rnd(1,9)}.${rnd(0,9)}.${rnd(0,9)}-RELEASE ...`}),
  ()=>({c:'cg', t:`[PKG  T${rnd(1,8)}] Checksum SHA-512: ${rndHex(32)} ✓`}),
  ()=>({c:'cw', t:`         Progress: [${'='.repeat(rnd(1,10))}${' '.repeat(10-rnd(1,10))}] ${rnd(5,99)}%`}),
  ()=>({c:'cg', t:`[PKG  T${rnd(1,8)}] Installation complete. Modules: ${rnd(12,240)}`}),
  // net
  ()=>({c:'cc', t:`[NET  T${rnd(1,8)}] Connecting → ${rnd(10,250)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}:${rnd(1024,65535)}`}),
  ()=>({c:'cg', t:`[NET  T${rnd(1,8)}] Tunnel established. RTT: ${rnd(5,120)}ms  TLS: AES-256-GCM`}),
  ()=>({c:'cc', t:`[NET  T${rnd(1,8)}] Proxying through TOR node: ${rndHex(16)}`}),
  ()=>({c:'cr', t:`[NET  T${rnd(1,8)}] IDS evasion: packet fragmentation active`}),
  // enc / dec
  ()=>({c:'cm', t:`[ENC  T${rnd(1,8)}] Decrypting payload... key: ${rndHex(32)}`}),
  ()=>({c:'cm', t:`[ENC  T${rnd(1,8)}] Decryption complete. Entropy: ${(Math.random()*2+6).toFixed(4)} bits/byte`}),
  ()=>({c:'cm', t:`[ENC  T${rnd(1,8)}] RSA-4096 keypair generated. Fingerprint: ${rndHex(20)}`}),
  // mem / hex dumps
  ()=>({c:'cd', t:`[MEM ] ${rndAddr()}: ${[...Array(8)].map(()=>rndHex(2)).join(' ')}  ${[...Array(8)].map(()=>String.fromCharCode(rnd(33,126))).join('')}`}),
  ()=>({c:'cd', t:`[MEM ] ${rndAddr()}: ${[...Array(8)].map(()=>rndHex(2)).join(' ')}  ${[...Array(8)].map(()=>String.fromCharCode(rnd(33,126))).join('')}`}),
  ()=>({c:'cd', t:`[BIN ] ${rndBin(32)} ${rndBin(16)}`}),
  // sys
  ()=>({c:'cg', t:`[SYS  T${rnd(1,8)}] CPU: ${rnd(55,99)}%  MEM: ${rnd(40,95)}%  NET: ${rnd(1,9)}.${rnd(0,9)}Gbps`}),
  ()=>({c:'cy', t:`[SYS  T${rnd(1,8)}] Injecting shellcode at ${rndAddr()}...`}),
  ()=>({c:'cg', t:`[SYS  T${rnd(1,8)}] Shellcode resident. PID: ${rnd(100,9999)}`}),
  ()=>({c:'cr', t:`[WARN T${rnd(1,8)}] Anomalous sector 0x${rndHex(4)} — suppressed`}),
  ()=>({c:'cr', t:`[WARN T${rnd(1,8)}] Honeytoken triggered — rerouting identity`}),
  ()=>({c:'cg', t:`[OK   T${rnd(1,8)}] Anti-forensics: log shredder armed`}),
  ()=>({c:'cb', t:`[P2P  T${rnd(1,8)}] Peer discovered: ${rndHex(40)}`}),
  ()=>({c:'cb', t:`[P2P  T${rnd(1,8)}] Blockchain anchor: block #${rnd(800000,900000)}`}),
  ()=>({c:'cg', t:`[OK   T${rnd(1,8)}] All modules synchronized. Awaiting command...`}),
];

const MAX_LINES = 24;
let displayed = [];

function addLogLine(entry) {
  const wrap = document.getElementById('logWrap');
  const curLine = document.getElementById('cursorLine');
  const div = document.createElement('div');
  div.className = 'll ' + entry.c;
  div.textContent = entry.t;
  wrap.insertBefore(div, curLine);
  displayed.push(div);
  if (displayed.length > MAX_LINES) {
    displayed.shift().remove();
  }
}

/* Simulate multiple async threads with wildly varying speeds */
function spawnThread(delay, period, jitter) {
  setTimeout(function fire() {
    const fn = LOG_POOL[Math.random() * LOG_POOL.length | 0];
    addLogLine(fn());
    const next = period + rnd(-jitter, jitter);
    setTimeout(fire, Math.max(40, next));
  }, delay);
}

/* Thread 0: very fast — hex/binary dumps */
spawnThread(200,  90,  60);
/* Thread 1: medium — net traffic */
spawnThread(500,  300, 150);
/* Thread 2: slow pausing — PKG installs */
spawnThread(800,  700, 500);
/* Thread 3: burst then pause — encryption */
spawnThread(1100, 220, 180);
/* Thread 4: random spikes */
spawnThread(300,  500, 450);
/* Thread 5: very slow warnings */
spawnThread(1500, 1400, 800);

/* pre-fill 12 lines instantly */
for(let i=0;i<12;i++){
  const fn = LOG_POOL[Math.random()*LOG_POOL.length|0];
  addLogLine(fn());
}
</script>
</body>
</html>
