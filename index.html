<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaâfari</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Amiri:wght@700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blood: #8b0000;
    --bone: #c8b89a;
    --void: #000000;
    --blue-cold: #1a6fff;
    --blue-glow: #00aaff;
    --smoke: #1a1a1a;
    --ash: #333;
  }

  body {
    background: var(--void);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Amiri', serif;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    z-index: 0;
    pointer-events: none;
    animation: grain 0.4s steps(1) infinite;
  }

  @keyframes grain {
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-1%,-2%)}
    20%{transform:translate(2%,1%)}
    30%{transform:translate(-2%,3%)}
    40%{transform:translate(1%,-1%)}
    50%{transform:translate(-1%,2%)}
    60%{transform:translate(3%,-2%)}
    70%{transform:translate(-2%,1%)}
    80%{transform:translate(1%,3%)}
    90%{transform:translate(-3%,-1%)}
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.85) 100%);
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 60px 40px;
    max-width: 700px;
    width: 100%;
  }

  .name {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--blue-cold);
    text-shadow:
      0 0 10px rgba(26,111,255,0.9),
      0 0 30px rgba(26,111,255,0.6),
      0 0 80px rgba(0,170,255,0.4),
      0 0 160px rgba(0,170,255,0.2);
    animation: namePulse 3s ease-in-out infinite;
    margin-bottom: 10px;
  }

  @keyframes namePulse {
    0%,100% {
      text-shadow:
        0 0 10px rgba(26,111,255,0.9),
        0 0 30px rgba(26,111,255,0.6),
        0 0 80px rgba(0,170,255,0.4),
        0 0 160px rgba(0,170,255,0.2);
    }
    50% {
      text-shadow:
        0 0 20px rgba(26,111,255,1),
        0 0 60px rgba(26,111,255,0.9),
        0 0 120px rgba(0,170,255,0.7),
        0 0 240px rgba(0,170,255,0.4);
    }
  }

  .divider {
    width: 80%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--blood), var(--blood), transparent);
    margin: 6px 0 20px;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '✦';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--blood);
    font-size: 0.7rem;
  }
  .divider::before { left: 10%; }
  .divider::after  { right: 10%; }

  .skull-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 10px 0 6px;
    filter: drop-shadow(0 0 30px rgba(139,0,0,0.5)) drop-shadow(0 0 80px rgba(139,0,0,0.25));
    animation: skullFloat 4s ease-in-out infinite;
  }

  @keyframes skullFloat {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-12px); }
  }

  .skull-svg { width: 100%; height: 100%; }

  .eye-glow {
    animation: eyeFlicker 2.5s ease-in-out infinite;
  }
  @keyframes eyeFlicker {
    0%,100%  { opacity: 1; fill: #ff0000; }
    15%      { opacity: 0.2; fill: #8b0000; }
    16%      { opacity: 1; fill: #ff0000; }
    40%      { opacity: 0.9; }
    80%      { opacity: 0.4; fill: #cc0000; }
    81%      { opacity: 1; fill: #ff2200; }
  }

  .quote-arabic {
    font-family: 'Amiri', serif;
    font-size: clamp(1.3rem, 3.5vw, 2rem);
    font-weight: 700;
    color: var(--bone);
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1.6;
    margin: 20px 0 6px;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.5s;
    text-shadow: 0 2px 20px rgba(200,184,154,0.3);
  }

  .quote-long {
    font-family: 'Amiri', serif;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #aaa;
    text-align: center;
    line-height: 1.8;
    margin: 14px 0 0;
    max-width: 560px;
    border-top: 1px solid #2a2a2a;
    padding-top: 18px;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 1s;
  }

  .quote-long .highlight {
    color: var(--blue-cold);
    font-weight: 700;
    text-shadow: 0 0 12px rgba(26,111,255,0.7);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ornament {
    margin-top: 28px;
    color: #2a2a2a;
    font-size: 1.4rem;
    letter-spacing: 0.5em;
    animation: fadeUp 1.2s ease forwards 1.4s;
    opacity: 0;
  }

  .drip-container {
    display: flex;
    justify-content: center;
    gap: 18px;
    height: 40px;
    margin-top: -4px;
  }
  .drip {
    width: 3px;
    background: linear-gradient(to bottom, var(--blood), transparent);
    border-radius: 0 0 4px 4px;
    animation: drip ease-in-out infinite;
  }
  .drip:nth-child(1) { height: 28px; animation-duration: 3.1s; animation-delay: 0s; }
  .drip:nth-child(2) { height: 40px; animation-duration: 2.7s; animation-delay: 0.4s; }
  .drip:nth-child(3) { height: 20px; animation-duration: 3.5s; animation-delay: 0.8s; }
  .drip:nth-child(4) { height: 36px; animation-duration: 2.9s; animation-delay: 0.2s; }
  .drip:nth-child(5) { height: 24px; animation-duration: 3.3s; animation-delay: 0.6s; }

  @keyframes drip {
    0%,100% { opacity: 0.3; transform: scaleY(0.6); }
    50%      { opacity: 1;   transform: scaleY(1); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="name">Jaâfari</div>
  <div class="divider"></div>

  <div class="skull-wrap">
    <svg class="skull-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="skullGrad" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#d4c9b0"/>
          <stop offset="60%" stop-color="#a89880"/>
          <stop offset="100%" stop-color="#5a4a38"/>
        </radialGradient>
        <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff4400"/>
          <stop offset="100%" stop-color="#8b0000"/>
        </radialGradient>
        <filter id="skullShadow">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
          <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8b0000" flood-opacity="0.4"/>
        </filter>
        <filter id="eyeBloom">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <ellipse cx="100" cy="88" rx="78" ry="72" fill="url(#skullGrad)" filter="url(#skullShadow)"/>
      <ellipse cx="100" cy="75" rx="55" ry="40" fill="rgba(255,255,255,0.07)"/>
      <ellipse cx="100" cy="105" rx="70" ry="30" fill="rgba(0,0,0,0.25)"/>

      <path d="M100 20 L96 45 L102 58 L98 75" stroke="#5a4a38" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M140 35 L128 55 L132 68" stroke="#5a4a38" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M58 42 L70 60 L65 75" stroke="#5a4a38" stroke-width="1.2" fill="none" opacity="0.6"/>

      <ellipse cx="68" cy="95" rx="24" ry="22" fill="#0a0505"/>
      <ellipse class="eye-glow" cx="68" cy="95" rx="14" ry="13" fill="url(#eyeGrad)" filter="url(#eyeBloom)" opacity="0.9"/>
      <ellipse cx="68" cy="95" rx="6" ry="6" fill="#ff2200" opacity="0.8"/>
      <ellipse cx="65" cy="93" rx="2" ry="2" fill="rgba(255,200,200,0.5)"/>

      <ellipse cx="132" cy="95" rx="24" ry="22" fill="#0a0505"/>
      <ellipse class="eye-glow" cx="132" cy="95" rx="14" ry="13" fill="url(#eyeGrad)" filter="url(#eyeBloom)" opacity="0.9"/>
      <ellipse cx="132" cy="95" rx="6" ry="6" fill="#ff2200" opacity="0.8"/>
      <ellipse cx="129" cy="93" rx="2" ry="2" fill="rgba(255,200,200,0.5)"/>

      <path d="M93 122 Q100 130 107 122 Q103 113 100 115 Q97 113 93 122Z" fill="#1a0e0e"/>

      <path d="M25 95 Q40 115 55 120" stroke="#8a7a65" stroke-width="2.5" fill="none" opacity="0.5"/>
      <path d="M175 95 Q160 115 145 120" stroke="#8a7a65" stroke-width="2.5" fill="none" opacity="0.5"/>

      <path d="M38 138 Q36 155 50 165 Q100 180 150 165 Q164 155 162 138 Q148 148 100 152 Q52 148 38 138Z"
            fill="#b5a490" stroke="#7a6a58" stroke-width="1"/>

      <rect x="58"  y="133" width="13" height="18" rx="2" ry="4" fill="#e8dcc8" stroke="#9a8a72" stroke-width="0.8"/>
      <rect x="74"  y="132" width="14" height="20" rx="2" ry="4" fill="#ede3d0" stroke="#9a8a72" stroke-width="0.8"/>
      <rect x="91"  y="132" width="14" height="20" rx="2" ry="4" fill="#ede3d0" stroke="#9a8a72" stroke-width="0.8"/>
      <rect x="108" y="132" width="14" height="20" rx="2" ry="4" fill="#ede3d0" stroke="#9a8a72" stroke-width="0.8"/>
      <rect x="125" y="133" width="13" height="18" rx="2" ry="4" fill="#e8dcc8" stroke="#9a8a72" stroke-width="0.8"/>
      <path d="M58 133 L65 133 L63 155 L56 152Z" fill="#ddd0b8" stroke="#9a8a72" stroke-width="0.5"/>
      <path d="M142 133 L135 133 L137 155 L144 152Z" fill="#ddd0b8" stroke="#9a8a72" stroke-width="0.5"/>
      <line x1="81" y1="133" x2="82" y2="148" stroke="#9a8a72" stroke-width="0.7" opacity="0.6"/>
      <line x1="100" y1="132" x2="100" y2="150" stroke="#9a8a72" stroke-width="0.5" opacity="0.5"/>

      <rect x="62"  y="152" width="11" height="14" rx="2" ry="3" fill="#d8ccb8" stroke="#8a7a62" stroke-width="0.7"/>
      <rect x="76"  y="151" width="12" height="16" rx="2" ry="3" fill="#ddd2be" stroke="#8a7a62" stroke-width="0.7"/>
      <rect x="91"  y="151" width="12" height="16" rx="2" ry="3" fill="#ddd2be" stroke="#8a7a62" stroke-width="0.7"/>
      <rect x="106" y="151" width="12" height="16" rx="2" ry="3" fill="#ddd2be" stroke="#8a7a62" stroke-width="0.7"/>
      <rect x="121" y="152" width="11" height="14" rx="2" ry="3" fill="#d8ccb8" stroke="#8a7a62" stroke-width="0.7"/>
      <rect x="58" y="148" width="84" height="4" fill="#120808" opacity="0.8"/>

      <path d="M60 117 Q58 128 61 135" stroke="#8b0000" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M74 118 Q73 132 75 140" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M126 118 Q127 130 125 138" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M140 117 Q142 129 139 136" stroke="#8b0000" stroke-width="2" fill="none" opacity="0.6"/>
    </svg>
  </div>

  <div class="drip-container">
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
  </div>

  <div class="quote-arabic">كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ</div>

  <div class="quote-long">
    وُجُودُ <span class="highlight">Jaâfari</span> فَوْقَ بَطْنِكَ<br>
    أَفْضَلُ مِنْ وُجُودِ ذِكْرَى فَوْقَ رَأْسِكَ
  </div>

  <div class="ornament">— ✦ —</div>

</div>
</body>
</html>
