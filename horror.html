<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Jaâfari</title>
    <style>
        /* CSS لتهيئة الجو المرعب */
        body {
            background-color: black; /* خلفية سوداء قاتمة */
            color: #ff0000; /* نصوص حمراء بلون الدم */
            font-family: 'Courier New', Courier, monospace; /* خط يشبه الآلة الكاتبة */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* منع التمرير */
        }

        /* تنسيق اسم جعفري بالأعلى */
        .header {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; /* تأثير توهج أحمر */
            margin-bottom: 20px;
        }

        /* تنسيق الجمجمة */
        .skull {
            font-size: 10rem; /* حجم كبير للجمجمة */
            color: white; /* لون الجمجمة أبيض */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7)); /* توهج أبيض */
            margin-bottom: 30px;
        }

        /* تنسيق النص السفلي */
        .footer-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #cccccc; /* لون رمادي باهت */
            margin-top: 10px;
        }

        /* لجعل التصميم متجاوباً مع الهواتف (Samsung A04s) */
        @media (max-width: 600px) {
            .header { font-size: 2.5rem; }
            .skull { font-size: 7rem; }
            .footer-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="header">jaâfari</div>

    <div class="skull">
        ☠️ </div>

    <div class="footer-text">
        ( كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ )
    </div>

</body>
</html>
